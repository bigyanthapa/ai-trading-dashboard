name: Position Management Alert (2:00 PM)

on:
  schedule:
    # 2:00 PM CST = 20:00 UTC (CST is UTC-6)
    - cron: '0 20 * * 1-5'  # Monday-Friday at 20:00 UTC (2:00 PM CST)
  workflow_dispatch:

jobs:
  position-mgmt:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas discord-webhook requests
      
      - name: Run position management alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python position_mgmt_alert.py
      
      - name: Notify on success
        if: success()
        run: echo "✅ Position management alert sent successfully"
      
      - name: Notify on failure
        if: failure()
        run: echo "❌ Position management alert failed"
