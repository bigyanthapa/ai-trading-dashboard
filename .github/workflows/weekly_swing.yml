name: Weekly AI Swing Dashboard

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  run-dashboard:
    runs-on: ubuntu-latest
    
    # Optional: Opt-in to Node 24 early to clear the warning
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6 # BUMP from v4 to v6

      - name: Setup Python
        uses: actions/setup-python@v6 # BUMP from v5 to v6
        with:
          python-version: '3.13' # Stable target for 2026

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py