name: Friday Weekly Wrap-Up (5:00 PM)

on:
  schedule:
    # 5:00 PM CST Friday = 23:00 UTC Friday (CST is UTC-6)
    - cron: '0 23 * * 5'  # Friday at 23:00 UTC (5:00 PM CST)
  workflow_dispatch:

jobs:
  weekly-wrap-up:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas discord-webhook requests
      
      - name: Run weekly wrap-up
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python weekly_wrap_up.py
      
      - name: Notify on success
        if: success()
        run: echo "✅ Weekly wrap-up sent successfully"
      
      - name: Notify on failure
        if: failure()
        run: echo "❌ Weekly wrap-up failed"
