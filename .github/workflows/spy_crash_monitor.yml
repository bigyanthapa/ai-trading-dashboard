name: SPY Crash Monitor (FOMC Transition Alert)

on:
  schedule:
    # Run hourly during market hours: 9:30 AM - 4:30 PM CST (15:30 - 22:30 UTC)
    # Monday-Friday only during crash window (May 15 - June 15, 2026)
    - cron: '30 15-22 * 5-6 1-5'  # May-June, Mon-Fri, hourly during market hours
    - cron: '30 15-22 1-14 6 1-5'  # June 1-14, Mon-Fri, hourly during market hours
  
  workflow_dispatch:
    inputs:
      force_alert:
        description: 'Force send alert regardless of crash threshold'
        required: false
        default: 'false'
        type: boolean
      test_mode:
        description: 'Run in test mode (any date)'
        required: false
        default: 'true'
        type: boolean

jobs:
  spy-crash-monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas discord-webhook requests
      
      - name: Run SPY crash monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FORCE_ALERT: ${{ inputs.force_alert || 'false' }}
          TEST_MODE: ${{ inputs.test_mode || 'true' }}
        run: |
          python spy_crash_monitor.py
      
      - name: Notify on success
        if: success()
        run: echo "✅ SPY crash monitor completed successfully"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ SPY crash monitor failed"
          # Send failure notification to Discord if needed