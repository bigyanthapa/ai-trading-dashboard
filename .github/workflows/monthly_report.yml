name: Monthly Equity Curve Report

on:
  schedule:
    # 13:00 UTC = 8:00 AM CDT / 9:00 AM EDT on the 1st day of the month
    - cron: '0 13 1 * *'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate and Send Chart
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python equity_curve.py